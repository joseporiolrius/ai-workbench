apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-models-json
data:
  models.json: |
    {
      "providers": {
        {{ .Values.modelsJson.provider | quote }}: {
          "baseUrl": {{ .Values.modelsJson.baseUrl | quote }},
          "api": "openai-completions",
          "apiKey": "$COURSE_VIRTUAL_KEY",
          "models": [ { "id": {{ .Values.modelsJson.model | quote }}{{ if .Values.modelsJson.maxTokens }}, "maxTokens": {{ .Values.modelsJson.maxTokens | int }}{{ end }} } ]
        }
      }
    }
