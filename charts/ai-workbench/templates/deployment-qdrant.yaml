apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-qdrant
  labels: { app: {{ .Release.Name }}-qdrant }
spec:
  replicas: 1
  selector: { matchLabels: { app: {{ .Release.Name }}-qdrant } }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-qdrant }
      {{- with .Values.qdrant.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image | quote }}
          ports: [ { containerPort: 6333 } ]
          readinessProbe:
            httpGet: { path: /healthz, port: 6333 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
      volumes:
        - name: storage
        {{- if .Values.qdrant.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-qdrant }
        {{- else }}
          emptyDir: {}
        {{- end }}
