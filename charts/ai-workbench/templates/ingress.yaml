{{- if .Values.ingress.enabled }}
{{- if not (regexMatch "^wb\\.a[0-9]{3}\\.dbai24\\.i40sys\\.com$" .Values.ingress.host) }}
{{- fail "Public ingress requires your assigned wb.aNNN.dbai24.i40sys.com hostname" }}
{{- end }}
{{- if not .Values.ingress.basicAuth.enabled }}
{{- fail "Public ingress requires basic authentication; TLS alone does not make the workbench private" }}
{{- end }}
{{- $authSecret := required "Public ingress requires an existing basic-auth Secret name" .Values.ingress.basicAuth.secretName }}
{{- $tlsSecret := required "Public ingress requires an instructor-provisioned TLS Secret name" .Values.ingress.tls.secretName }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-auth
spec:
  basicAuth:
    secret: {{ $authSecret | quote }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ $tlsSecret | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-pi-web-ui
                port: { number: 80 }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-http-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-pi-web-ui
                port: { number: 80 }
{{- end }}
