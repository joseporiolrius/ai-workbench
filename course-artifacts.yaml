# ai-workbench course artifact manifest — S9 + S10 (STARTER-11/12).
# Schema: dbai/course-artifacts/v1. S10 adds the `monitoring:` section (release -> chart ->
# pinned image overrides, disabled workloads) and its chart/image records; install-monitoring.sh
# and monitoring-inventory.py read ONLY this file for versions and image pins.
schema: dbai/course-artifacts/v1
baseline_version: 1.0.0
monitoring:
  namespace: monitoring
  approved_registry: ghcr.io/oriolrius
  releases:
  - release: prometheus
    chart: monitoring-chart-prometheus
    values: monitoring/prometheus-values.yaml
    image_overrides:
    - image: monitoring-image-prometheus
      set:
        repository: server.image.repository
        tag: server.image.tag
        digest: server.image.digest
    - image: monitoring-image-prometheus-config-reloader
      set:
        repository: configmapReload.prometheus.image.repository
        tag: configmapReload.prometheus.image.tag
        digest: configmapReload.prometheus.image.digest
    - image: monitoring-image-node-exporter
      set:
        registry: prometheus-node-exporter.image.registry
        repository: prometheus-node-exporter.image.repository
        tag: prometheus-node-exporter.image.tag
        digest: prometheus-node-exporter.image.digest
    - image: monitoring-image-kube-state-metrics
      set:
        registry: kube-state-metrics.image.registry
        repository: kube-state-metrics.image.repository
        tag: kube-state-metrics.image.tag
        digest: kube-state-metrics.image.sha
  - release: blackbox
    chart: monitoring-chart-blackbox-exporter
    values: monitoring/blackbox-values.yaml
    image_overrides:
    - image: monitoring-image-blackbox-exporter
      set:
        registry: image.registry
        repository: image.repository
        tag: image.tag
        digest: image.digest
  - release: grafana
    chart: monitoring-chart-grafana
    values: monitoring/grafana-values.yaml
    image_overrides:
    - image: monitoring-image-grafana
      digest_format: hex
      set:
        registry: image.registry
        repository: image.repository
        tag: image.tag
        digest: image.sha
  disabled_workloads:
  - release: prometheus
    workload: alertmanager
    absent: (?i)alertmanager
    switch: alertmanager.enabled=false
    reason: notification routing out of scope (doc-17 §5)
  - release: prometheus
    workload: prometheus-pushgateway
    absent: (?i)pushgateway
    switch: prometheus-pushgateway.enabled=false
    reason: Pushgateway out of scope (doc-17 §5)
  - release: prometheus
    workload: configmap-reload-alertmanager
    absent: (?i)configmap-reload-alertmanager
    switch: alertmanager.enabled=false
    reason: only runs with Alertmanager
  - release: blackbox
    workload: config-reloader
    absent: (?i)/config-reloader$
    switch: configReloader.enabled=false
    reason: chart default; config changes roll the pod via helm upgrade
  - release: grafana
    workload: test-framework (bats)
    absent: (?i)(^Pod/.*test|bats)
    switch: testFramework.enabled=false
    reason: chart 13.2.5 ships no test templates (value is vestigial); kept false and verified absent
  - release: grafana
    workload: init-chown-data (busybox)
    absent: (?i)(init-chown-data|busybox)
    switch: initChownData.enabled=false
    reason: local-path volumes are created 0777; no chown init needed
  - release: grafana
    workload: k8s-sidecar (dashboards/datasources)
    absent: (?i)(k8s-sidecar|grafana-sc-)
    switch: sidecar.*.enabled=false (chart default)
    reason: dashboards are student-built and exported, not sidecar-loaded
  - release: grafana
    workload: download-dashboards (curl)
    absent: (?i)download-dashboards
    switch: 'no dashboards: provider (chart default)'
    reason: no remote dashboard downloads
  - release: grafana
    workload: image-renderer
    absent: (?i)image-renderer
    switch: imageRenderer.enabled=false (chart default)
    reason: not needed; memory budget
