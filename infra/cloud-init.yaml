#cloud-config
# Containers profile bootstrap (PROFILE-03, doc-18 §5) — the S4–S7 VM. Ubuntu
# 24.04 on t3.medium. Adds Docker Engine + the Compose plugin ON TOP of the
# foundations tools (git, uv, SSH already present); it deliberately does NOT
# pre-solve the student Dockerfile, Compose file, release workflow or S6
# recovery. Still EXCLUDES k3s, kubectl, eksctl/EKS/kind, Micromamba and heavy
# notebook defaults — those arrive with the operations profile in S8.
#
# Rendered with the enrolled PUBLIC keys (authorized_keys); byte-identical file
# across the controller and student roots. Idempotent: reapplying converges, and
# an S6 rebuild from this same bootstrap recreates the same container platform.
package_update: true
packages:
  - git
  - curl
  - ca-certificates
  - unzip
  - docker.io
  - docker-compose-v2
%{ if length(authorized_keys) > 0 ~}
ssh_authorized_keys:
%{ for key in authorized_keys ~}
  - ${key}
%{ endfor ~}
%{ endif ~}
runcmd:
  # uv (Astral) carried over from foundations — pinned installer, once.
  - [ cloud-init-per, once, dbai-uv, sh, -c, "curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh" ]
  # Docker daemon on at boot, and let the student user drive it without sudo.
  - [ cloud-init-per, once, dbai-docker-enable, systemctl, enable, --now, docker ]
  - [ cloud-init-per, once, dbai-docker-group, usermod, -aG, docker, ubuntu ]
%{ if k3s_enabled ~}
  # S8 (k3s_enabled): pinned single-node k3s + kubectl + Helm (matches the
  # ec2-console operations profile, PROFILE-04). --write-kubeconfig-mode 644 gives
  # the student sudo-less kubectl.
  - [ cloud-init-per, once, dbai-k3s, sh, -c, "curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.30.5+k3s1 INSTALL_K3S_EXEC='--write-kubeconfig-mode 644' sh -" ]
  - [ cloud-init-per, once, dbai-kubectl, sh, -c, "ln -sf /usr/local/bin/k3s /usr/local/bin/kubectl" ]
  - [ cloud-init-per, once, dbai-helm, sh, -c, "cd /tmp && curl -fsSLO https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz && echo '11400fecfc07fd6f034863e4e0c4c4445594673fd2a129e701fe41f31170cfa9  helm-v3.15.4-linux-amd64.tar.gz' | sha256sum -c - && tar xzf helm-v3.15.4-linux-amd64.tar.gz && install -m0755 linux-amd64/helm /usr/local/bin/helm" ]
  - [ cloud-init-per, once, dbai-marker, sh, -c, "echo operations > /etc/dbai-profile && echo dbai-workspace-bootstrap > /etc/dbai-bootstrap" ]
%{ else ~}
  - [ cloud-init-per, once, dbai-marker, sh, -c, "echo containers > /etc/dbai-profile && echo dbai-workspace-bootstrap > /etc/dbai-bootstrap" ]
%{ endif ~}
