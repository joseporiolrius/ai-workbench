# S10 — Grafana (grafana-community/grafana; the grafana/helm-charts copy is
# deprecated). Chart version and image pin come from ../course-artifacts.yaml
# via scripts/install-monitoring.sh.
#
# Access is PRIVATE: kubectl port-forward on the VM + SSH -L from the laptop.
# No Service of type LoadBalancer/NodePort, no Ingress (the S10 homework adds a
# basic-auth protected Ingress — see monitoring/README.md).

# Admin password: generated by the chart into Secret monitoring/grafana
# (key admin-password) and kept across upgrades. Never set it here.
adminUser: admin

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true

persistence:
  enabled: true              # your dashboard survives a pod restart
  type: pvc
  size: 1Gi
  storageClassName: local-path

initChownData:
  enabled: false             # local-path dirs are 0777; no busybox init image
testFramework:
  enabled: false             # no helm-test pod (and no unmirrored bats image)

service:
  type: ClusterIP

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 384Mi }
