# S10 — Prometheus (individual chart prometheus-community/prometheus, NOT
# kube-prometheus-stack). Chart version and every image pin come from
# ../course-artifacts.yaml via scripts/install-monitoring.sh — do not add image
# settings here. No Operator, no ServiceMonitor, no Alertmanager, no Pushgateway.

# --- what runs -------------------------------------------------------------
alertmanager:
  enabled: false            # a firing alert is the end state; nothing pages you
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: true             # pod/deployment state (kube_*), discovered via service annotation
prometheus-node-exporter:
  enabled: true             # node CPU/memory/disk (node_*)

server:
  global:
    scrape_interval: 15s    # chart default is 1m — too coarse for a 2-minute alert and the LOAD FEST
    evaluation_interval: 15s
  retention: 7d
  persistentVolume:
    enabled: true
    size: 8Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 1Gi }

# The chart's default scrape jobs already cover: Prometheus itself, kubelet +
# cAdvisor (container_*), service endpoints (kube-state-metrics, node-exporter)
# and any pod annotated prometheus.io/scrape="true" (job kubernetes-pods) —
# that last one is how Qdrant is found once you add its podAnnotations.

# --- the black-box probe -----------------------------------------------------
# The authenticated HTTPS workbench URL (https://wb.aNNN.dbai24.i40sys.com/).
# install-monitoring.sh fills this from the live workbench Ingress; it is not a
# secret. The probe credentials live ONLY in Secret monitoring/workbench-probe-auth.
workbenchProbe:
  url: ""

extraScrapeConfigs: |
  - job_name: cert-manager
    static_configs:
      - targets: [cert-manager.cert-manager.svc.cluster.local:9402]
  - job_name: workbench-probe
    metrics_path: /probe
    params:
      module: [workbench_authenticated]
    static_configs:
      - targets: [{{ required "workbenchProbe.url is required (the authenticated workbench URL)" .Values.workbenchProbe.url | quote }}]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-prometheus-blackbox-exporter:9115

# --- the one alert ------------------------------------------------------------
# A label is not a notification: with no Alertmanager installed, WorkbenchDown
# becomes pending/firing in the Prometheus UI and pages nobody.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: workbench
        rules:
          - alert: WorkbenchDown
            expr: probe_success{job="workbench-probe"} == 0
            for: 2m
            labels:
              severity: page
            annotations:
              summary: "Workbench is down (authenticated probe failing)"
              description: "probe_success for {{ $labels.instance }} has been 0 for 2 minutes."
          - alert: WorkbenchCertificateExpiring
            expr: probe_ssl_earliest_cert_expiry{job="workbench-probe"} - time() < 14 * 86400
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "Workbench certificate expires within 14 days; ask the instructor to inspect renewal"
          - alert: WorkbenchCertificateNotReady
            expr: certmanager_certificate_ready_status{namespace="workbench",condition="True"} == 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "Workbench certificate is not Ready; inspect DNS and issuer status without reissuing"
          - alert: WorkbenchRenewalOverdue
            expr: time() - certmanager_certificate_renewal_timestamp_seconds{namespace="workbench"} > 86400
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "Workbench renewal has been due for over a day; inspect events and quota reservation"
          - alert: CertificateControllerUnavailable
            expr: up{job="cert-manager"} == 0
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Certificate controller metrics unavailable"
